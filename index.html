<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幻阵 — Card Tower Defense</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
    #game-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    #game-container canvas {
      image-rendering: auto;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('game-status');
      if (!el) { el = document.createElement('div'); el.id = 'game-status'; document.body.appendChild(el); }
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;padding:8px 16px;font-family:monospace;font-size:13px;color:#f00;background:rgba(0,0,0,0.9);text-align:center;';
      el.textContent = 'JS错误: ' + (err && err.message || msg) + ' (行' + line + ')';
      console.error('Global error:', msg, src, line, col, err);
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('game-status');
      if (!el) { el = document.createElement('div'); el.id = 'game-status'; document.body.appendChild(el); }
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;padding:8px 16px;font-family:monospace;font-size:13px;color:#f00;background:rgba(0,0,0,0.9);text-align:center;';
      el.textContent = 'Promise错误: ' + (e.reason && e.reason.message || String(e.reason));
      console.error('Unhandled rejection:', e.reason);
    });
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
